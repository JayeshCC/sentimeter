name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'JayeshCC/sentimeter'
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
        # Add other languages as the project grows: 'python', 'java', 'csharp', 'cpp', 'go'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Add custom queries for enhanced security scanning
        queries: security-extended,security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Truffleberry secret scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
      # Only run if package.json exists
      if: hashFiles('**/package.json') != ''

    - name: Install dependencies
      run: npm ci --only=production
      if: hashFiles('**/package.json') != ''

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      if: hashFiles('**/package.json') != ''

    - name: Run Snyk vulnerability scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium
      if: hashFiles('**/package.json') != '' && env.SNYK_TOKEN != ''

  documentation-security:
    name: Documentation Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for hardcoded secrets in docs
      run: |
        echo "Checking for potential secrets in documentation..."
        
        # Check for common secret patterns (excluding examples)
        if grep -r -E "(password|secret|key|token)\s*[:=]\s*['\"][^'\"]{8,}" --include="*.md" . | grep -v -E "(YOUR_|your_|example|sample|placeholder|<|>)"; then
          echo "❌ Potential hardcoded secrets found in documentation!"
          exit 1
        else
          echo "✅ No hardcoded secrets found in documentation"
        fi

    - name: Check for insecure URLs
      run: |
        echo "Checking for insecure HTTP URLs..."
        
        # Allow localhost HTTP for development examples
        if grep -r "http://" --include="*.md" . | grep -v "http://localhost" | grep -v "http://127.0.0.1"; then
          echo "❌ Insecure HTTP URLs found (should use HTTPS in production examples)!"
          exit 1
        else
          echo "✅ No insecure URLs found in documentation"
        fi

    - name: Validate security policy exists
      run: |
        if [ ! -f "SECURITY.md" ]; then
          echo "❌ SECURITY.md file is missing!"
          exit 1
        else
          echo "✅ SECURITY.md file exists"
        fi

  link-security:
    name: Link Security Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install markdown-link-check
      run: npm install -g markdown-link-check

    - name: Check links in documentation
      run: |
        echo "Checking links in markdown files..."
        find . -name "*.md" -not -path "./node_modules/*" -exec markdown-link-check {} \;

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [codeql, secret-scan, documentation-security, link-security]
    if: always()
    
    steps:
    - name: Security scan summary
      run: |
        echo "## 🛡️ Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.codeql.result }}" == "success" ]; then
          echo "✅ CodeQL Analysis: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ CodeQL Analysis: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.secret-scan.result }}" == "success" ]; then
          echo "✅ Secret Scanning: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Secret Scanning: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.documentation-security.result }}" == "success" ]; then
          echo "✅ Documentation Security: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Documentation Security: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.link-security.result }}" == "success" ]; then
          echo "✅ Link Validation: Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Link Validation: Failed" >> $GITHUB_STEP_SUMMARY
        fi